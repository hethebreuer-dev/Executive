name = "luft-ingest"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Create the DB with `wrangler d1 create luft`, then paste the returned id here.
[[d1_databases]]
binding = "DB"
database_name = "luft"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# R2 bucket for seller-uploaded photos ("List your car").
# Create with `wrangler r2 bucket create luft-photos`.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "luft-photos"

# Ingest on a schedule (every 30 min). Tighten for auctions nearing close.
[triggers]
crons = ["*/30 * * * *"]

# Non-secret vars. Mock is off by default; set to "1" to opt the seed data back
# in (e.g. bootstrapping an empty D1). Production leaves this off.
[vars]
LUFT_ENABLE_MOCK = "0"

# Secrets — set with `wrangler secret put <NAME>` (never commit these):
#   EBAY_APP_ID, EBAY_CERT_ID, EBAY_ENV, EBAY_MARKETPLACE
#   APIFY_TOKEN
#   INGEST_SECRET   (guards POST /ingest)
#   SUBMIT_SECRET   (guards POST /submit — must match the app's WORKER_SUBMIT_SECRET)
#   ADMIN_SECRET    (guards /admin/* — must match the app's WORKER_ADMIN_SECRET)
